[build]
  command = "corepack enable && yarn cedar build"
  publish = "web/dist"
  environment = { NODE_VERSION = "22" }

[functions]
  directory = "api/dist/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
